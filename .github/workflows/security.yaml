name: Security Scan

# `push` is limited to the long-lived branches. On a branch with an open pull
# request both events fired, so every push validated the same commit twice.
on:
  pull_request:
  push:
    branches: [dev, main]

# No `concurrency` here, deliberately. `security-pr-comment.yaml` wakes on this
# workflow's completion, a cancellation included, and downloads the
# `security-reports` artifact. A cancelled scan uploads none, and that consumer
# fails rather than skipping when the artifact is missing. Limiting `push`
# already removes the duplicate run, which is what this was for.

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run Bandit Security Scan
        run: |
          uv run --with "bandit[toml]" bandit -r src/ -f json -o bandit-report.json || true
          uv run --with "bandit[toml]" bandit -r src/ -f txt
      - name: Install ASH
        run: |
          # Mutable git tags can be repointed; pin to the release commit.
          uv tool install git+https://github.com/awslabs/automated-security-helper.git@e73de85c1db7f443276370c4a6f7501815756780 # v3.1.2
      # Fails the job on any actionable finding (ASH exits 2). Reviewed false
      # positives carry an inline `# nosec <rule>` with a reason.
      - name: Run ASH Security Scan
        run: |
          ash --mode local
      # ASH exits 0 when a scanner is MISSING or ERRORs, which would silently
      # turn the gate off. Fail unless the core scanners actually ran. The
      # per-scanner files are read because the aggregated JSON's `status` is
      # unreliable (detect-secrets reads SKIPPED even when it ran).
      - name: Require core ASH scanners to have run
        if: ${{ !cancelled() }}
        run: |
          python3 -I - <<'EOF'
          import json, pathlib, sys

          bad = []
          for name in ("bandit", "detect-secrets", "semgrep"):
              path = pathlib.Path(".ash/ash_output/scanners", name, "source", "ASH.ScanResults.json")
              try:
                  status = json.loads(path.read_text()).get("status")
              except (OSError, ValueError) as e:
                  status = f"unreadable ({e.__class__.__name__})"
              print(f"{name}: {status}")
              if status not in ("PASSED", "FAILED"):
                  bad.append(name)
          if bad:
              sys.exit(f"::error::ASH scanners did not run: {', '.join(bad)}")
          EOF
      # `always()` so a failed scan still hands its PR number to
      # `security-pr-comment.yaml`, which posts the findings.
      - name: Save PR number
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt
      - name: Upload Security Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            .ash/ash_output/
            pr-number.txt

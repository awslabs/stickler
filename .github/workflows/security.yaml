name: Security Scan

# `push` is limited to the long-lived branches. On a branch with an open pull
# request both events fired, so every push validated the same commit twice.
on:
  pull_request:
  push:
    branches: [dev, main]

# No `concurrency` here, deliberately. `security-pr-comment.yaml` wakes on this
# workflow's completion, a cancellation included, and downloads the
# `security-reports` artifact. A cancelled scan uploads none, and that consumer
# fails rather than skipping when the artifact is missing. Limiting `push`
# already removes the duplicate run, which is what this was for.

permissions:
  contents: read

jobs:
  # uv enforces the cooldown only when it resolves, from pyproject's
  # `exclude-newer`; `uv sync --frozen` installs whatever uv.lock holds. So check
  # the settings, and that lock entries added or changed since the base (the PR
  # base, or the previous tip on push) are past the window or carry a dated
  # emergency exemption. Unchanged entries are never re-judged. An expired
  # exemption fails pushes and PRs that touch pyproject.toml or uv.lock, and only
  # warns on other PRs. The lock's absolute `exclude-newer` is unused.
  cooldown:
    name: Dependency cooldown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the 7-day uv cooldown is intact
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # A Dependabot PR that only Dependabot has pushed to. A human push makes
          # github.actor a person, so the age check applies again.
          DEPENDABOT_PR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' }}
        run: |
          # A base without uv.lock makes every entry new.
          base_lock="$RUNNER_TEMP/base-uv.lock"
          git fetch --no-tags --depth=1 origin "$BASE"
          git show "$BASE:uv.lock" > "$base_lock" || rm -f "$base_lock"
          flags=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --quiet "$BASE" HEAD -- pyproject.toml uv.lock; then
            flags=(--stale-exemption-warns)
          fi
          if [ "$DEPENDABOT_PR" = true ]; then
            flags+=(--dependabot-pr)
          fi
          python3 -I .github/scripts/check_uv_cooldown.py "$base_lock" "${flags[@]}"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run Bandit Security Scan
        run: |
          uv run --with "bandit[toml]" bandit -r src/ -f json -o bandit-report.json || true
          uv run --with "bandit[toml]" bandit -r src/ -f txt
      - name: Install ASH
        run: |
          # Mutable git tags can be repointed; pin to the release commit.
          uv tool install git+https://github.com/awslabs/automated-security-helper.git@e73de85c1db7f443276370c4a6f7501815756780 # v3.1.2
      - name: Run ASH Security Scan
        continue-on-error: true
        run: |
          ash --mode local
      - name: Save PR number
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt
      - name: Upload Security Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            .ash/ash_output/
            pr-number.txt

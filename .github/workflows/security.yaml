name: Security Scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run Bandit Security Scan
        run: |
          uv run --with "bandit[toml]" bandit -r src/ -f json -o bandit-report.json || true
          uv run --with "bandit[toml]" bandit -r src/ -f txt
      - name: Install ASH
        run: |
          # Mutable git tags can be repointed; pin to the release commit.
          uv tool install git+https://github.com/awslabs/automated-security-helper.git@e73de85c1db7f443276370c4a6f7501815756780 # v3.1.2
      - name: Run ASH Security Scan
        continue-on-error: true
        run: |
          ash --mode local
      - name: Save PR number
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt
      - name: Upload Security Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            .ash/ash_output/
            pr-number.txt

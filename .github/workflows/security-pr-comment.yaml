name: Security Scan PR Comment

on:
  workflow_run:
    workflows: ["Security Scan"]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    # A cancelled scan uploads no artifact, so there is nothing to post.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download security-reports artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-reports
          path: security-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Post ASH summary to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const prNumberPath = 'security-reports/pr-number.txt';
            const reportPath = 'security-reports/.ash/ash_output/reports/ash.summary.md';

            if (!fs.existsSync(prNumberPath)) {
              core.info('No pr-number.txt in artifact; nothing to comment on.');
              return;
            }
            const prNumber = parseInt(fs.readFileSync(prNumberPath, 'utf8').trim(), 10);
            if (!Number.isFinite(prNumber)) {
              core.setFailed(`Invalid PR number: ${prNumber}`);
              return;
            }

            // The artifact comes from the scanned PR's own run, so a PR that
            // edits security.yaml controls pr-number.txt. Only comment on the
            // PR whose head is the commit that was scanned.
            const run = context.payload.workflow_run;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.head.sha !== run.head_sha || pr.head.repo?.full_name !== run.head_repository?.full_name) {
              core.warning(`pr-number.txt names #${prNumber}, whose head is not the scanned commit ${run.head_sha}; not commenting.`);
              return;
            }

            if (!fs.existsSync(reportPath)) {
              core.info('ASH summary report not found; skipping comment.');
              return;
            }
            const reportContent = fs.readFileSync(reportPath, 'utf8');
            const marker = '<!-- ash-security-scan-report -->';
            const body = `${marker}\n## Security Scan Results\n\n${reportContent}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info('Created new comment');
            }
